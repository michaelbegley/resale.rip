<style>
:root{--bg:#FFFFFF;--fg:#000000;--muted:#6E6A64;--field:#FFFFFF;--line:#000000;--btn-bg:#000000;--btn-fg:#FFFFFF;--track-bg:#FFFFFF;--track-border:#000000;--knob:#000000;--knob-left:3px;color-scheme:light}
:root[data-theme="dark"]{--bg:#000000;--fg:#F4EFE6;--muted:#CFC9BF;--field:#000000;--line:#F4EFE6;--btn-bg:#F4EFE6;--btn-fg:#000000;--track-bg:#F4EFE6;--track-border:#F4EFE6;--knob:#000000;--knob-left:24px;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
header{display:flex;justify-content:flex-end;padding:16px 20px}
.switch{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:44px;padding:0;border:0;border-radius:999px;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;visibility:hidden}
.js .switch{visibility:visible}
.track{position:relative;display:block;width:52px;height:30px;border-radius:999px;border:1.5px solid var(--track-border);background:var(--track-bg);transition:background-color .25s ease,border-color .25s ease}
.knob{position:absolute;top:2.5px;left:var(--knob-left);width:22px;height:22px;border-radius:999px;background:var(--knob);transition:left .25s ease}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:25.5px;padding:16px 24px 80px;text-align:center}
.logo{position:relative;width:min(220px,56%);aspect-ratio:902/1000}
.logo svg{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.i{fill:var(--fg)}.c{fill:var(--bg)}
.i,.c{transition:fill .3s ease}
@keyframes rr-wave{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.hand{animation:rr-wave 3.3s ease-in-out infinite;transform-origin:52.38% 75.5%}
@media (prefers-reduced-motion:reduce){.hand{animation:none}}
.signup{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:24.5px;margin:0}
.lead{margin:0;font-size:17px;font-weight:500;line-height:1.5}
.row{position:relative;width:100%}  /* the arrow sits inside the box, so the box is one piece centred under the heading */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
input{display:block;width:100%;min-width:0;height:54px;padding:0 57px 0 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--field);color:var(--fg);font:inherit;font-size:16px;transition:background-color .3s ease,color .3s ease,border-color .3s ease}
input::placeholder{color:var(--muted);opacity:1}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px var(--field) inset;-webkit-text-fill-color:var(--fg);caret-color:var(--fg)}
.go{position:absolute;top:5px;right:5px;width:44px;height:44px;padding:0;border-radius:999px;border:0;background:var(--btn-bg);color:var(--btn-fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .3s ease,color .3s ease,opacity .2s ease}
.go:disabled{opacity:.55;cursor:progress}
.switch:focus-visible,input:focus-visible,.go:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
input:focus{outline:2px solid var(--fg);outline-offset:3px}
.msg{margin:0;font-size:14px;line-height:1.4}
.hp{position:absolute;left:-10000px;width:1px;height:1px;opacity:0}
.done{margin:0;min-height:50px;display:flex;align-items:center;font-size:18px;font-weight:500;outline:none}
.foot{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:10px;row-gap:4px;padding:0 max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));font-size:13px;font-weight:500;line-height:20px;z-index:1}
.foot .l{justify-self:end}.foot .r{justify-self:start}
.foot .sl,.foot .legal{color:var(--muted);transition:color .3s ease}
.foot .legal{letter-spacing:.04em}
.foot a{color:inherit;text-decoration:none;text-underline-offset:3px;-webkit-tap-highlight-color:transparent}
.foot a:hover{text-decoration:underline}
.foot a:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:4px}
.ig{display:inline-flex;align-items:center;gap:6px}
.ig svg{width:16px;height:16px;flex:none;display:block}

<script>
(function () {
  var root = document.documentElement;
  var sw = document.getElementById('rr-theme');
  var meta = document.querySelector('meta[name="theme-color"]');
  function apply(t) {
    root.setAttribute('data-theme', t);
    sw.setAttribute('aria-checked', t === 'dark' ? 'true' : 'false');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#000000' : '#FFFFFF');
  }
  apply(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  sw.addEventListener('click', function () {
    var t = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(t);
    try { localStorage.setItem('rr-theme', t); } catch (e) {}
  });

  var form = document.getElementById('rr-form');
  var done = document.getElementById('rr-done');
  var err = document.getElementById('rr-error');
  var go = form.querySelector('.go');
  var hp = document.getElementById('rr-hp');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (hp.value) { form.hidden = true; done.hidden = false; return; }   // a bot filled the hidden field
    go.disabled = true;
    err.hidden = true;
    err.textContent = '';
    fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' } })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        form.hidden = true;
        done.hidden = false;
        done.focus();
      })
      .catch(function () {
        err.textContent = 'Something went wrong. Try again.';
        err.hidden = false;
        go.disabled = false;
      });
  });
})();
</script>
